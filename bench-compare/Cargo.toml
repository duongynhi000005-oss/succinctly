[package]
name = "json-parser-bench"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
criterion = "0.5"
serde_json = "1.0"
simd-json = "0.14"
sonic-rs = "0.3"
serde_yaml = "0.9"
succinctly = { path = "..", features = ["simd"] }
tracking-allocator = "0.4"

# Succinct rank/select crates, compared against succinctly's BitVec in succinct_libs.
# Each is given its best-available acceleration so the comparison is like-for-like:
# succinctly's `simd` selects NEON/AVX-512 popcount, vers-vecs' `simd` its AVX-512 select,
# sucds' `intrinsics` its broadword helpers. sux has no equivalent feature.
rand = "0.8"
rand_chacha = "0.3"
sucds = { version = "0.8", features = ["intrinsics"] }
# default-features = false turns off sux's own `zstd`, `flate2` and `rayon` features (compressed
# serialisation and parallel builders; the bench only builds and queries one rank/select
# structure, serially). `zstd` 0.13 carries RUSTSEC-2026-0391 and its `zstd-safe` 7.x a family
# of advisories fixed only in zstd >= 0.14.3, which sux 0.14 cannot take (#5342). Turning the
# defaults back on brings those advisories, and the failing audit, back.
sux = { version = "0.14", default-features = false }
vers-vecs = { version = "1.10", features = ["simd"] }

[[bench]]
name = "json_parsers"
harness = false

[[bench]]
name = "yaml_parsers"
harness = false

[[bench]]
name = "succinct_libs"
harness = false
